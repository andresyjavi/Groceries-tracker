<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Grocery Tracker</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2f6f4f">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Compras">

<style>
:root{--bg:#f4f1ec;--sf:#fbfaf7;--tx:#1f2420;--mu:#7a7f78;--bd:#e3ded5;--ac:#2f6f4f;--ac2:#e8f0ea;--hero:#1f3d2e;--herotx:#f4f1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a17;--sf:#1f231f;--tx:#ece9e2;--mu:#98a095;--bd:#2d332d;--ac:#6fc08f;--ac2:#25302a;--hero:#2a4d3a;--herotx:#f4f1ec;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a17;--sf:#1f231f;--tx:#ece9e2;--mu:#98a095;--bd:#2d332d;--ac:#6fc08f;--ac2:#25302a;--hero:#2a4d3a;--herotx:#f4f1ec;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
nav{width:220px;padding:24px 14px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:700;font-size:17px;padding:0 10px 22px;letter-spacing:-.3px}.logo span{color:var(--ac)}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer;transition:.15s}
nav button:hover{background:var(--ac2);color:var(--tx)}nav button.on{background:var(--ac2);color:var(--ac);font-weight:600}
main{flex:1;padding:32px clamp(16px,4vw,48px);max-width:1100px;min-width:0}
h1{font-size:26px;letter-spacing:-.6px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 24px}
.hero{background:var(--hero);color:var(--herotx);border-radius:24px;padding:28px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;animation:in .4s}
.hero .big{font-size:clamp(40px,7vw,64px);font-weight:700;letter-spacing:-2px;line-height:1}.hero small{opacity:.7}
.kp{display:flex;flex-wrap:wrap;gap:28px;margin:22px 0 0}.kp div b{display:block;font-size:20px}.kp div span{opacity:.7;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:32px}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.2px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px;animation:in .4s}
.bar{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-radius:10px;cursor:pointer;transition:.15s}
.bar:hover{background:var(--ac2)}.bar .t{height:7px;border-radius:4px;background:var(--bd);margin-top:5px;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:4px;transition:width .5s}
.bar small,.mu{color:var(--mu);font-size:13px}.bar.leaf{cursor:default}
.crumb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:5px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 16px;border-radius:10px;font:inherit;cursor:pointer}.btn.g{background:none;color:var(--mu);border:1px solid var(--bd)}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;font:inherit;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.empty{text-align:center;padding:40px 16px;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.demo{background:#f0c14b33;color:#8a6a00;padding:2px 8px;border-radius:99px;font-size:11px;margin-left:6px}
table{width:100%;border-collapse:collapse}td{padding:9px 6px;border-bottom:1px solid var(--bd)}td:last-child,.r{text-align:right}
.tip{font-size:13px;background:var(--ac2);border-radius:12px;padding:10px 14px;margin-top:14px;color:var(--mu)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:8px;border:0;border-bottom:1px solid var(--bd);background:var(--bg);overflow-x:auto}.logo{display:none}nav button{white-space:nowrap;width:auto}.hero,.row{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const CATS={ "Carne":{c:"#c0583e",s:{"Pollo":["Contramuslos de pollo","Pechuga de pollo"],"Cerdo":["Carne picada de cerdo","Lomo de cerdo"],"Ternera":["Carne picada de ternera","Filetes de ternera"]}},
"Lácteos":{c:"#4a7fb0",s:{"Leche":["Leche entera","Leche semidesnatada"],"Queso":["Queso Gouda"],"Yogures":["Yogur natural"]}},
"Frutas y verduras":{c:"#7aa33f",s:{"Frutas":["Plátanos","Manzanas"],"Verduras":["Tomates","Zanahorias"]}},
"Bebidas":{c:"#8a5cb0",s:{"Agua":["Agua mineral"],"Refrescos":["Cola"]}},
"Panadería":{c:"#d39a3a",s:{"Pan":["Pan de molde"]}},
"Otros":{c:"#8b8f88",s:{"Sin clasificar":["Sin clasificar"]}}};
const eur=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(n);
const dfmt=s=>s.split("-").reverse().join("/");
let S={purchases:[]},view="panel",path=[],period="mes";
const NAV=[["panel","▦ Panel"],["cats","◔ Categorías"],["compras","☰ Compras"],["escanear","⌁ Escanear"],["ajustes","⚙ Ajustes"]];
function lsGet(){try{return JSON.parse(localStorage.getItem("sgt")||"null")}catch(e){return null}}
function save(){try{localStorage.setItem("sgt",JSON.stringify(S))}catch(e){alert("Almacenamiento lleno: exporta una copia en Ajustes.")}render()}
S=lsGet()||S;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("sgt",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function uploadImg(id,u){try{const d=await idb();d.transaction("img","readwrite").objectStore("img").put(u,id)}catch(e){}}
async function showImg(id){try{const d=await idb(),q=d.transaction("img").objectStore("img").get(id);q.onsuccess=()=>{if(!q.result){alert("No hay foto guardada para esta compra.");return}const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:#000d;z-index:99;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto";o.onclick=()=>o.remove();o.innerHTML='<img src="'+q.result+'" style="max-width:100%;max-height:100%;border-radius:12px" alt="Ticket">';document.body.appendChild(o)}}catch(e){alert("No se pudo abrir la foto.")}}
async function callScan(blob,prompt){const key=localStorage.getItem("sgt_key");if(!key)throw Error("Falta la clave de la API. Añádela en Ajustes.");const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(blob)});
let res;try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true","content-type":"application/json"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:4000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:prompt}]}]})})}catch(e){throw Error("Sin conexión con la API de Anthropic.")}
const j=await res.json().catch(()=>({}));if(!res.ok)throw Error(res.status===401?"Clave de API no válida.":(j.error&&j.error.message)||"Error de la API ("+res.status+").");
const t=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");try{return JSON.parse(t.replace(/```json|```/g,"").trim())}catch(e){throw Error("Respuesta ilegible de la IA. Inténtalo de nuevo.")}}
function dl(n,t,x){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x],{type:t}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function exportJSON(){dl("smart-grocery-backup.json","application/json",JSON.stringify(S))}
function exportCSV(){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',r=[["fecha","hora","supermercado","original_de","producto_es","cantidad","unidad","precio_neto","descuento","categoria","subcategoria","producto"]];S.purchases.forEach(p=>p.items.forEach(i=>r.push([p.date,p.time||"",p.store,i.de,i.es,i.qty,i.unit,i.price,i.disc||0,i.cat,i.sub,i.prod])));dl("compras.csv","text/csv","\ufeff"+r.map(x=>x.map(q).join(";")).join("\n"))}
async function importJSON(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.purchases))throw 0;if(!confirm("Esto reemplazará los datos actuales. ¿Continuar?"))return;S=j;save()}catch(e){alert("Archivo no válido")}}
function settingsView(){return `<h1>Ajustes</h1><p class="sub">Todo se guarda solo en este dispositivo</p><div class="panel"><h2>Clave de la API de Anthropic</h2><p class="mu">Necesaria para leer tickets. Se guarda solo en este dispositivo y se envía únicamente a api.anthropic.com. Créala en console.anthropic.com y fija un límite de gasto mensual.</p><div class="form"><input id="ak" type="password" placeholder="sk-ant-..." value="${esc(localStorage.getItem("sgt_key")||"")}"></div><button class="btn" onclick="localStorage.setItem('sgt_key',document.getElementById('ak').value.trim());alert('Clave guardada')">Guardar clave</button></div><div class="panel" style="margin-top:20px"><h2>Copia de seguridad</h2><p class="mu">Si borras los datos del navegador o dejas de usar la app durante semanas, Safari puede eliminar los datos. Exporta una copia de vez en cuando. Las fotos de los tickets no se incluyen en la copia.</p><button class="btn" onclick="exportJSON()">Exportar copia (JSON)</button> <button class="btn g" onclick="exportCSV()">Exportar CSV</button> <label class="btn g" style="display:inline-block;cursor:pointer">Importar copia<input type="file" accept="application/json" hidden onchange="importJSON(this.files[0])"></label></div>`}
function demo(){const st=["Netto","Netto","Lidl"],items=[["HÄHNCHEN OBERSCH.","Contramuslos de pollo",400,"g",3.2,"Carne","Pollo"],["SCHWEINEHACK","Carne picada de cerdo",500,"g",4.5,"Carne","Cerdo"],["RINDERHACK","Carne picada de ternera",500,"g",5.2,"Carne","Ternera"],["VOLLMILCH","Leche entera",1000,"ml",1.15,"Lácteos","Leche"],["GOUDA","Queso Gouda",400,"g",3.1,"Lácteos","Queso"],["BANANEN","Plátanos",1000,"g",1.79,"Frutas y verduras","Frutas"],["TOMATEN","Tomates",500,"g",1.99,"Frutas y verduras","Verduras"],["MINERALWASSER","Agua mineral",1500,"ml",.69,"Bebidas","Agua"],["TOASTBROT","Pan de molde",500,"g",1.29,"Panadería","Pan"]];
const out=[],now=new Date();let k=0;for(let i=0;i<40;i++){const d=new Date(now-i*3*864e5*1.1),n=3+(i%4);const its=[];for(let j=0;j<n;j++){const it=items[(i*3+j*2)%items.length];const v=1+((i+j)%5-2)*.04+(70-i)*.001;its.push({de:it[0],es:it[1],qty:it[2],unit:it[3],price:+(it[4]*v).toFixed(2),cat:it[5],sub:it[6],prod:it[1]})}
out.push({id:"d"+k++,demo:1,store:st[i%3],date:d.toISOString().slice(0,10),items:its})}return out}
const tot=p=>p.items.reduce((a,i)=>a+i.price,0);
function monday(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x.toISOString().slice(0,10)}
function agg(list,lvl,filter){const m={};list.forEach(p=>p.items.forEach(i=>{const keys=[i.cat,i.sub,i.prod];if(filter.some((f,x)=>keys[x]!==f))return;const k=keys[lvl];m[k]=m[k]||{k,sum:0,n:new Set(),q:{}};const o=m[k];o.sum+=i.price;o.n.add(p.id);const u=i.unit==="g"?"kg":i.unit==="ml"?"l":"ud";o.q[u]=(o.q[u]||0)+(u==="ud"?i.qty:i.qty/1000)}));return Object.values(m).sort((a,b)=>b.sum-a.sum)}
const qs=q=>Object.entries(q).map(([u,v])=>v.toLocaleString("es-ES",{maximumFractionDigits:2})+" "+u).join(" + ");
const col=c=>(CATS[c]||{}).c||"#8b8f88";
function donut(rows,total,onclick){let a=-Math.PI/2,r=70,s="";rows.forEach((o,i)=>{const f=o.sum/total,b=a+f*2*Math.PI;if(f>.999)s+=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${o.c}" stroke-width="26"/>`;else{const x=(t,rr)=>90+rr*Math.cos(t),y=(t,rr)=>90+rr*Math.sin(t);s+=`<path d="M${x(a,r)} ${y(a,r)}A${r} ${r} 0 ${f>.5?1:0} 1 ${x(b,r)} ${y(b,r)}" fill="none" stroke="${o.c}" stroke-width="26" style="cursor:pointer" onclick="${onclick(o.k)}"><title>${o.k}: ${eur(o.sum)} (${(f*100).toFixed(0)} %)</title></path>`}a=b});return `<svg viewBox="0 0 180 180" width="190" style="display:block;margin:auto">${s}<text x="90" y="88" text-anchor="middle" font-size="11" fill="var(--mu)">Total</text><text x="90" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="var(--tx)">${eur(total)}</text></svg>`}
function trend(list){const w={};list.forEach(p=>{const k=monday(p.date);w[k]=(w[k]||0)+tot(p)});const ks=Object.keys(w).sort().slice(-12);if(ks.length<2)return `<div class="empty">Se necesitan al menos 2 semanas de datos.</div>`;const mx=Math.max(...ks.map(k=>w[k])),W=100/ks.length;
return `<svg viewBox="0 0 300 130" width="100%">${ks.map((k,i)=>{const h=w[k]/mx*95;return `<rect x="${i*25+3}" y="${105-h}" width="19" height="${h}" rx="5" fill="var(--ac)" opacity="${.45+.55*i/ks.length}"><title>Semana del ${dfmt(k)}: ${eur(w[k])}</title></rect>`}).join("")}<text x="3" y="124" font-size="8" fill="var(--mu)">${dfmt(ks[0])}</text><text x="297" y="124" font-size="8" text-anchor="end" fill="var(--mu)">${dfmt(ks[ks.length-1])}</text></svg>`}
function rows(rs,lvl,total){return rs.map(o=>`<div class="bar ${lvl>=2?"leaf":""}" ${lvl<2?`onclick="drill('${o.k.replace(/'/g,"\\'")}')"`:""}><span style="width:12px;height:12px;border-radius:4px;background:${o.c};display:block;margin-left:4px"></span><div><b>${o.k}</b> <small>· ${o.n.size} compra${o.n.size>1?"s":""} · ${qs(o.q)}</small><div class="t"><i style="width:${o.sum/total*100}%;background:${o.c}"></i></div></div><div class="r"><b>${eur(o.sum)}</b><br><small>${(o.sum/total*100).toFixed(0)} %</small></div></div>`).join("")}
function drill(k){if(view!=="cats")view="cats";path=[...path,k];render()}
function go(v){view=v;if(v!=="cats")path=[];render()}
function periodList(){const now=new Date().toISOString();if(period==="todo")return S.purchases;const lim=period==="mes"?now.slice(0,7):monday(new Date());return S.purchases.filter(p=>period==="mes"?p.date.startsWith(lim):p.date>=lim)}
function emptyBox(){return `<div class="panel empty"><b>Aún no hay compras</b>Registra una compra desde “Compras” o carga datos de demostración para explorar el diseño.<br><br><button class="btn" onclick="S.purchases=demo();save()">Cargar datos de demostración</button><div class="tip">También puedes escanear un ticket desde “Escanear”.</div></div>`}
function catView(list){const lvl=path.length,rs=agg(list,lvl,path).map(o=>({...o,c:lvl===0?col(o.k):col(path[0])}));const total=rs.reduce((a,o)=>a+o.sum,0);if(!rs.length)return emptyBox();
const crumb=`<div class="crumb"><button class="chip ${lvl?"":"on"}" onclick="path=[];render()">Todas</button>${path.map((p,i)=>`<span class="mu">›</span><button class="chip ${i===lvl-1?"on":""}" onclick="path=path.slice(0,${i+1});render()">${p}</button>`).join("")}${lvl?`<button class="chip" onclick="path.pop();render()">← Volver</button>`:""}</div>`;
return crumb+`<div class="panel" style="display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:center" id="cg">${donut(rs,total,k=>`drill('${k.replace(/'/g,"\\'")}')`)}<div>${rows(rs,lvl,total)}</div></div><div class="tip">Cada nivel suma exactamente sus elementos inferiores. Incluye solo productos (los depósitos Pfand se registrarán aparte en la Fase 2).</div><style>@media(max-width:760px){#cg{grid-template-columns:1fr!important}}</style>`}
function render(){document.getElementById("nav").innerHTML=`<div class="logo">Smart <span>Grocery</span></div>`+NAV.map(([k,l])=>`<button class="${view===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");const m=document.getElementById("main"),list=periodList(),hasDemo=S.purchases.some(p=>p.demo);let h="";
const pill=hasDemo?`<span class="demo">datos de demostración</span> <button class="chip" onclick="S.purchases=S.purchases.filter(p=>!p.demo);save()">Eliminar demo</button>`:"";
const per=`<div class="crumb">${["semana","mes","todo"].map(p=>`<button class="chip ${period===p?"on":""}" onclick="period='${p}';render()">${{semana:"Semana",mes:"Mes",todo:"Todo"}[p]}</button>`).join("")}${pill}</div>`;
if(view==="panel"){if(!S.purchases.length)h=`<h1>Panel</h1><p class="sub">Tu resumen de compras</p>`+emptyBox();else{const total=list.reduce((a,p)=>a+tot(p),0),n=list.length,items=list.reduce((a,p)=>a+p.items.length,0),cs=agg(list,0,[]),st={};list.forEach(p=>st[p.store]=(st[p.store]||0)+tot(p));const top=cs[0];
const stR=Object.entries(st).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({k,sum:v,c:"var(--ac)",n:new Set(list.filter(p=>p.store===k).map(p=>p.id)),q:{}}));
h=`<h1>Panel</h1><p class="sub">Semanas de lunes a domingo · Europe/Berlin</p>${per}<div class="hero"><div><small>Gasto ${{semana:"de esta semana",mes:"de este mes",todo:"total"}[period]}</small><div class="big">${eur(total)}</div><div class="kp"><div><b>${n}</b><span>compras</span></div><div><b>${items}</b><span>productos</span></div><div><b>${n?eur(total/n):"–"}</b><span>media por compra</span></div><div><b>${top?top.k:"–"}</b><span>mayor gasto</span></div></div></div><div style="background:#ffffff12;border-radius:16px;padding:12px">${total?donut(cs.map(o=>({...o,c:col(o.k)})),total,k=>`drill('${k.replace(/'/g,"\\'")}')`):""}</div></div>
<div class="row"><div class="panel"><h2>Gasto semanal</h2>${trend(S.purchases)}</div><div class="panel"><h2>Por supermercado</h2>${stR.map(o=>`<div class="bar leaf" style="grid-template-columns:1fr auto"><div><b>${o.k}</b><div class="t"><i style="width:${o.sum/total*100}%;background:var(--ac)"></i></div></div><b>${eur(o.sum)}</b></div>`).join("")||`<div class="empty">Sin datos en este periodo.</div>`}</div></div>`}}
else if(view==="cats")h=`<h1>Categorías</h1><p class="sub">Categoría → subcategoría → producto</p>${per}`+catView(list);
else if(view==="compras")h=`<h1>Compras</h1><p class="sub">Registro manual (o usa “Escanear”)</p>`+form()+`<div class="panel" style="margin-top:20px">${S.purchases.length?`<table>${[...S.purchases].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(p=>`<tr><td><b>${p.store}</b>${p.demo?'<span class="demo">demo</span>':""}<br><small class="mu">${dfmt(p.date)} · ${p.items.length} productos</small></td><td><b>${eur(tot(p))}</b></td><td style="width:80px">${p.demo?"":`<button class="chip" onclick="showImg('${p.id}')" title="Ver ticket">🧾</button> `}<button class="chip" onclick="del('${p.id}')" title="Eliminar">✕</button></td></tr>`).join("")}</table>`:`<div class="empty"><b>Sin compras</b>Añade tu primera compra arriba.</div>`}</div>`;
else if(view==="ajustes")h=settingsView();else h=scanView();
m.innerHTML=h;if(view==="escanear"&&SC.st==="review")chk()}
function form(){return `<div class="panel"><h2>Nueva compra</h2><div class="form"><input id="fs" value="Netto" placeholder="Supermercado"><input id="fd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="fn" placeholder="Producto (ES)"><input id="fq" type="number" placeholder="Cantidad"><select id="fu"><option value="g">g</option><option value="ml">ml</option><option value="ud">ud</option></select><input id="fp" type="number" step=".01" placeholder="Precio €"><select id="fc" onchange="subs()">${Object.keys(CATS).map(c=>`<option>${c}</option>`)}</select><select id="fb"></select></div><button class="btn" onclick="add()">Guardar compra</button><div id="fe" class="mu" style="margin-top:8px"></div></div>`}
function subs(){const c=document.getElementById("fc").value;document.getElementById("fb").innerHTML=Object.keys(CATS[c].s).map(s=>`<option>${s}</option>`)}
new MutationObserver(()=>{if(document.getElementById("fb")&&!document.getElementById("fb").innerHTML)subs()}).observe(document.body,{childList:true,subtree:true});
function add(){const g=i=>document.getElementById(i).value.trim(),e=document.getElementById("fe");const price=parseFloat(g("fp")),qty=parseFloat(g("fq"));if(!g("fs")||!g("fn")||!(price>0)||!(qty>0)){e.textContent="Completa supermercado, producto, cantidad y precio.";return}
S.purchases.push({id:"p"+Date.now(),store:g("fs"),date:g("fd"),items:[{de:"",es:g("fn"),qty,unit:g("fu"),price:Math.round(price*100)/100,cat:g("fc"),sub:g("fb"),prod:g("fn")}]});save()}
function del(id){if(confirm("¿Eliminar esta compra?")){S.purchases=S.purchases.filter(p=>p.id!==id);save()}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,SC={st:"idle"};
function scanView(){if(SC.st==="proc")return `<h1>Escanear ticket</h1><p class="sub">Leyendo el ticket…</p><div class="panel empty"><b>${SC.msg}</b><div style="height:8px;background:var(--bd);border-radius:5px;overflow:hidden;max-width:360px;margin:14px auto"><i style="display:block;height:100%;width:${SC.pr}%;background:var(--ac);transition:width .6s"></i></div>Puede tardar unos segundos.</div>`;if(SC.st==="review")return review();
return `<h1>Escanear ticket</h1><p class="sub">Sube una foto de tu ticket de Netto (o de otro supermercado)</p><div class="panel empty"><b>Foto del ticket</b>${SC.err?`<div style="color:#c0583e;margin-bottom:12px">${esc(SC.err)}</div>`:""}<label class="btn" style="display:inline-block;cursor:pointer">Subir imagen<input type="file" accept="image/jpeg,image/png" hidden onchange="scan(this.files[0])"></label> <label class="btn g" style="display:inline-block;cursor:pointer">Usar cámara<input type="file" accept="image/*" capture="environment" hidden onchange="scan(this.files[0])"></label><div class="tip">JPG o PNG. El PDF aún no está soportado: haz una captura. La IA no inventa: lo que no entienda quedará marcado para revisar.</div></div>`}
function shrink(f,max,q,url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);url?res(c.toDataURL("image/jpeg",q)):c.toBlob(b=>b?res(b):rej(Error("Imagen ilegible")),"image/jpeg",q)};im.onerror=()=>rej(Error("Imagen ilegible"));im.src=URL.createObjectURL(f)})}
function norm(it){const k=["pfand","descuento"].includes(it.kind)?it.kind:"producto",okc=CATS[it.cat];return{kind:k,de:it.de||"",es:it.es||"",qty:+it.qty||1,unit:["g","ml","ud"].includes(it.unit)?it.unit:"ud",price:k==="descuento"?-Math.abs(+it.price||0):(+it.price||0),disc:k==="producto"?-Math.abs(+it.disc||0):0,cat:okc?it.cat:"Otros",sub:okc?(it.sub||"Sin clasificar"):"Sin clasificar",prod:okc?(it.prod||it.es||""):"Sin clasificar",confidence:it.confidence,to:null}}
function buildPrompt(known){return `Eres un experto en tickets de supermercados alemanes (Netto Marken-Discount, ALDI, Lidl, REWE, EDEKA). Analiza la imagen y responde SOLO con JSON válido, sin texto adicional:
{"store":"","date":"YYYY-MM-DD","time":"HH:MM","total":0.00,"items":[{"de":"texto original","es":"producto en español interpretado","qty":0,"unit":"g|ml|ud","price":0.00,"disc":0.00,"kind":"producto|pfand|descuento","cat":"","sub":"","prod":"","confidence":"alta|baja"}]}
Reglas: price es el importe total de la línea (no el unitario); qty la cantidad comprada (400 g → qty 400, unit g; 2 x → 2 ud). Punto decimal. Los descuentos (Rabatt, Aktion, Coupon, Preisvorteil) que pertenezcan a un producto van en su campo disc con valor negativo; solo los no asignables van como línea kind descuento. Pfand/Leergut/Pfandrückgabe son kind pfand (devoluciones negativas). No incluyas MwSt, Summe ni pagos como líneas. Interpreta abreviaturas (HÄHNCHEN OBERSCH. = contramuslos de pollo, SCHWEINEHACK = carne picada de cerdo, RINDERHACK = carne picada de ternera, VOLLMILCH = leche entera), no traduzcas literalmente. NO inventes: si no entiendes una línea pon es "", confidence baja, cat "Otros", sub "Sin clasificar". Categorías permitidas: ${Object.keys(CATS).join(", ")}. Subcategorías existentes: ${JSON.stringify(Object.fromEntries(Object.entries(CATS).map(([k,v])=>[k,Object.keys(v.s)])))}; puedes proponer subcategoría o producto nuevo si no encaja. Reutiliza exactamente estos productos ya registrados si es el mismo producto, sin fusionar variantes distintas (cerdo≠ternera, entera≠semidesnatada): ${JSON.stringify(known)}. confidence baja si dudas del texto, precio o clasificación.`}
async function scan(f){if(!f)return;SC={st:"proc",msg:"Preparando imagen",pr:10};render();try{if(!/^image\/(jpeg|png)/.test(f.type))throw Error("Formato no válido. Usa JPG o PNG.");if(f.size>15e6)throw Error("La imagen supera 15 MB.");const blob=await shrink(f,1800,.82),small=await shrink(f,1100,.6,true);SC.msg="Leyendo productos y precios";SC.pr=50;render();const known=[...new Set(S.purchases.flatMap(p=>p.items.map(i=>i.prod)))].slice(0,150);const r=await callScan(blob,buildPrompt(known));SC.msg="Clasificando";SC.pr=90;render();if(!r||!Array.isArray(r.items)||!r.items.length)throw Error("No se han reconocido productos. Prueba con una foto más nítida y completa.");const items=r.items.map(norm);let last=null;items.forEach((x,i)=>{if(x.kind==="producto")last=i;else if(x.kind==="descuento")x.to=last});D={store:r.store||"",date:/^\d{4}-\d\d-\d\d$/.test(r.date)?r.date:"",time:r.time||"",total:+r.total||0,img:small,items};SC={st:"review"}}catch(e){SC={st:"idle",err:(e&&e.message)||"No se pudo procesar el ticket."}}render()}
function line(it,i){const low=it.kind==="producto"&&(it.confidence==="baja"||!it.es),x=`<button class="chip" onclick="D.items.splice(${i},1);render()" title="Eliminar">✕</button>`,n=(f,t)=>`<input type="number" step=".01" value="${it[f]}" oninput="D.items[${i}].${f}=+this.value;chk()" style="${t||""}">`;
if(it.kind==="pfand")return `<div class="ln"><span class="mu" style="flex:2">Pfand · ${esc(it.de)}</span>${n("price")}${x}</div>`;
if(it.kind==="descuento")return `<div class="ln"><span class="mu" style="flex:2">Descuento · ${esc(it.de)}</span>${n("price")}<select onchange="D.items[${i}].to=+this.value">${D.items.map((y,j)=>y.kind==="producto"?`<option value="${j}" ${j===it.to?"selected":""}>${esc(y.es||y.de)}</option>`:"").join("")}</select>${x}</div>`;
return `<div class="ln" style="${low?"border-left:3px solid #d39a3a;padding-left:8px":""}"><div class="mu" style="flex-basis:100%">${esc(it.de)||"Línea añadida"}${it.disc?` · dto. ${eur(it.disc)}`:""}${low?" · <b>revisar</b>":""}</div><input style="flex:2 1 150px" value="${esc(it.es)}" placeholder="Nombre en español" oninput="D.items[${i}].es=this.value">${n("qty","max-width:80px")}<select style="max-width:70px" onchange="D.items[${i}].unit=this.value">${["g","ml","ud"].map(u=>`<option ${u===it.unit?"selected":""}>${u}</option>`).join("")}</select>${n("price","max-width:90px")}<select onchange="D.items[${i}].cat=this.value;D.items[${i}].sub=Object.keys(CATS[this.value].s)[0];D.items[${i}].prod='';render()">${Object.keys(CATS).map(c=>`<option ${c===it.cat?"selected":""}>${c}</option>`).join("")}</select><input list="dl${i}" value="${esc(it.sub)}" oninput="D.items[${i}].sub=this.value" placeholder="Subcategoría"><datalist id="dl${i}">${Object.keys((CATS[it.cat]||{s:{}}).s).map(s=>`<option value="${s}">`).join("")}</datalist><input value="${esc(it.prod)}" oninput="D.items[${i}].prod=this.value" placeholder="Producto específico">${x}</div>`}
function review(){return `<style>.ln{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.ln input,.ln select{width:auto;flex:1 1 90px}</style><h1>Revisar ticket</h1><p class="sub">Comprueba los datos antes de guardar. Las líneas marcadas necesitan revisión.</p><div class="panel"><div class="form"><input value="${esc(D.store)}" oninput="D.store=this.value;chk()" placeholder="Supermercado"><input type="date" value="${D.date}" oninput="D.date=this.value;chk()"><input type="time" value="${D.time}" oninput="D.time=this.value"><input type="number" step=".01" value="${D.total}" oninput="D.total=+this.value;chk()" title="Total del ticket"></div><div id="chk"></div></div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;align-items:flex-start"><div class="panel" style="flex:1 1 560px;min-width:0">${D.items.map(line).join("")}<button class="chip" style="margin-top:12px" onclick="D.items.push(norm({kind:'producto',qty:1,unit:'ud',price:0,confidence:'baja',cat:'Otros',sub:'Sin clasificar'}));render()">+ Añadir línea</button></div><div class="panel" style="flex:0 1 220px"><b>Ticket original</b><img src="${D.img}" alt="Ticket" style="width:100%;border-radius:10px;margin-top:8px"></div></div><div style="margin-top:16px;display:flex;gap:10px"><button class="btn" id="ok" onclick="confirmP()">Confirmar compra</button><button class="btn g" onclick="SC={st:'idle'};D=null;render()">Descartar</button></div>`}
function chk(){const c=x=>Math.round(x*100);let net=0,pf=0,ds=0;D.items.forEach(i=>{if(i.kind==="producto")net+=c(i.price)+c(i.disc);else if(i.kind==="pfand")pf+=c(i.price);else ds+=c(i.price)});const calc=net+pf+ds,diff=calc-c(D.total),dup=D.store&&S.purchases.some(p=>p.store.toLowerCase()===D.store.trim().toLowerCase()&&p.date===D.date&&Math.abs(c(p.total??tot(p))-c(D.total))<=1);SC.dup=dup;
document.getElementById("chk").innerHTML=`<div class="tip" style="color:${diff?"#c0583e":"var(--ac)"}">${diff?`⚠ La suma (${eur(calc/100)}) no coincide con el total (${eur(D.total)}). Diferencia: ${eur(diff/100)}.`:"✓ La suma coincide con el total del ticket."}<br><span class="mu">Productos ${eur(net/100)} · Descuentos sueltos ${eur(ds/100)} · Pfand ${eur(pf/100)} (el Pfand no cuenta como gasto en productos)</span></div>${dup?`<div class="tip" style="color:#c0583e">⚠ Ya existe una compra con el mismo supermercado, fecha e importe. <label><input type="checkbox" style="width:auto" ${SC.ok?"checked":""} onchange="SC.ok=this.checked;chk()"> Es una compra distinta</label></div>`:""}`;document.getElementById("ok").disabled=!!dup&&!SC.ok}
function confirmP(){const r=x=>Math.round(x*100)/100,ps=D.items.filter(i=>i.kind==="producto");if(!D.store.trim()||!D.date||!ps.length){alert("Faltan supermercado, fecha o productos.");return}const net=new Map(ps.map(i=>[i,r(i.price+i.disc)]));D.items.forEach(i=>{if(i.kind==="descuento"){const t=D.items[i.to];if(t&&net.has(t))net.set(t,r(net.get(t)+i.price))}});const id="p"+Date.now(),pfand=r(D.items.filter(i=>i.kind==="pfand").reduce((a,i)=>a+i.price,0));S.purchases.push({id,store:D.store.trim(),date:D.date,time:D.time,total:D.total,pfand,items:ps.map(i=>({de:i.de,es:i.es||i.de,qty:i.qty,unit:i.unit,price:net.get(i),disc:i.disc,cat:i.cat,sub:i.sub||"Sin clasificar",prod:i.prod||i.es||i.de}))});uploadImg(id,D.img);SC={st:"idle"};D=null;view="panel";save()}
render();
</script></body></html>
